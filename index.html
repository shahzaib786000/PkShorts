<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909"><meta name="description" content="PkShorts — short videos, your vibe.">
<title>PkShorts</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font:15px system-ui,-apple-system,Segoe UI,sans-serif}
header{position:fixed;z-index:5;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:linear-gradient(#000c,transparent)}
.logo{font-weight:900;font-size:23px;letter-spacing:-1px}.logo span{color:#ff3158}.tabs{display:flex;gap:18px;font-weight:700}.tabs button{background:none;border:0;color:#aaa;font-size:15px}.tabs .active{color:#fff;border-bottom:2px solid #ff3158;padding-bottom:5px}
.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory}.video-card{height:100dvh;min-height:500px;position:relative;scroll-snap-align:start;background:#171717;overflow:hidden}
video{height:100%;width:100%;object-fit:cover;background:#171717}.shade{position:absolute;inset:0;background:linear-gradient(transparent 45%,#000b 100%);pointer-events:none}
.info{position:absolute;left:16px;right:84px;bottom:88px;z-index:2;text-shadow:0 1px 5px #000}.user{font-weight:800;font-size:16px;margin-bottom:9px}.desc{line-height:1.4;margin-bottom:10px}.music{font-size:13px;color:#eee}
.actions{position:absolute;right:13px;bottom:100px;display:flex;flex-direction:column;align-items:center;gap:19px;z-index:3}.action{border:0;background:#1118;color:white;border-radius:50%;width:48px;height:48px;font-size:24px;display:grid;place-items:center}.action.liked{color:#ff3158}.count{font-size:12px;text-align:center;margin-top:-15px;text-shadow:0 1px 4px #000}
.bottom{position:fixed;bottom:0;left:0;right:0;height:60px;padding-bottom:env(safe-area-inset-bottom);z-index:8;background:#090909f5;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #292929}.bottom button{background:none;border:0;color:#bbb;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}.bottom b{font-size:22px;color:#fff}.bottom .plus{color:#ff3158;font-size:30px}
.upload{display:none}.notice{position:fixed;z-index:10;top:65px;left:50%;transform:translateX(-50%);background:#222;padding:10px 15px;border-radius:10px;display:none;max-width:90%;text-align:center}
.modal{position:fixed;z-index:20;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px}.panel{background:#1b1b1b;border:1px solid #333;border-radius:18px;padding:20px;width:min(420px,100%)}.panel input,.panel textarea{width:100%;background:#090909;border:1px solid #444;color:white;padding:12px;border-radius:10px;margin:8px 0}.primary{background:#ff3158;color:white;border:0;padding:12px 16px;border-radius:10px;font-weight:800;width:100%;margin-top:8px}.close{float:right;background:none;border:0;color:#fff;font-size:22px}
@media(min-width:600px){.feed{max-width:430px;margin:auto;border-left:1px solid #222;border-right:1px solid #222}.bottom{left:calc(50% - 215px);right:calc(50% - 215px)}header{left:calc(50% - 215px);right:calc(50% - 215px)}}
</style></head>
<body>
<header><div class="logo">Pk<span>Shorts</span></div><div class="tabs"><button class="active" onclick="switchTab(this)">For You</button><button onclick="switchTab(this)">Following</button></div><button aria-label="Search" onclick="showNotice('Search demo: real search ke liye backend chahiye')" style="background:none;border:0;color:white;font-size:22px">⌕</button></header>
<div class="notice" id="notice"></div>
<main class="feed" id="feed">
<section class="video-card"><video playsinline loop muted autoplay controlslist="nodownload" poster="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=900&q=80"><source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4"></video><div class="shade"></div><div class="info"><div class="user">@pk_creator · <span style="color:#ff6682">Follow +</span></div><div class="desc">Nature vibes 🌸 Apna din khubsurat banao! #PkShorts #Nature</div><div class="music">♫ Original sound — PkShorts</div></div><div class="actions"><button class="action" onclick="like(this)">♥</button><div class="count">1.2K</div><button class="action" onclick="comment()">●</button><div class="count">86</div><button class="action" onclick="share()">↗</button><div class="count">Share</div><button class="action" onclick="showNotice('Sound feature jald aa raha hai 🎵')">♫</button></div></section>
<section class="video-card"><video playsinline loop muted controlslist="nodownload" poster="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80"><source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4"></video><div class="shade"></div><div class="info"><div class="user">@travel_diary · <span style="color:#ff6682">Follow +</span></div><div class="desc">Safar, yaadein aur naye nazare ✨ #Travel</div><div class="music">♫ Travel beat — demo</div></div><div class="actions"><button class="action" onclick="like(this)">♥</button><div class="count">834</div><button class="action" onclick="comment()">●</button><div class="count">42</div><button class="action" onclick="share()">↗</button><div class="count">Share</div><button class="action" onclick="showNotice('Sound feature jald aa raha hai 🎵')">♫</button></div></section>
</main>
<nav class="bottom"><button onclick="document.getElementById('feed').scrollTo({top:0,behavior:'smooth'})"><b>⌂</b>Home</button><button onclick="showNotice('Search ke liye online database baad mein add hoga')"><b>⌕</b>Search</button><button onclick="document.getElementById('file').click()"><b class="plus">＋</b>Upload</button><button onclick="showNotice('Inbox demo — accounts/backend baad mein add hoga')"><b>✉</b>Inbox</button><button onclick="openProfile()"><b>◉</b>Profile</button></nav>
<input class="upload" id="file" type="file" accept="video/*" onchange="uploadVideo(event)">
<div class="modal" id="modal"><div class="panel"><button class="close" onclick="closeModal()">×</button><h3 id="modalTitle">PkShorts</h3><div id="modalBody"></div></div></div>
<script>
function showNotice(s){let n=document.getElementById('notice');n.textContent=s;n.style.display='block';clearTimeout(window.nt);window.nt=setTimeout(()=>n.style.display='none',2600)}
function like(b){b.classList.toggle('liked');b.textContent=b.classList.contains('liked')?'♥':'♥';let c=b.nextElementSibling;if(c){let v=parseFloat(c.textContent)||0;c.textContent=b.classList.contains('liked')?String(v+1):String(Math.max(0,v-1))}}
function switchTab(b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');showNotice(b.textContent==='Following'?'Following feed demo — sign-in/backend baad mein add hoga':'For You feed')}
function share(){if(navigator.share){navigator.share({title:'PkShorts',text:'Ye PkShorts video dekho!'})}else{navigator.clipboard?.writeText(location.href).then(()=>showNotice('Link copy ho gaya!')).catch(()=>showNotice('Browser share option use karein'))}}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
function comment(){openModal('Comments','<p>Demo comments yahan nazar aayenge.</p><input id="commentText" placeholder="Comment likhein..."><button class="primary" onclick="sendComment()">Comment post karein</button>')}
function sendComment(){let v=document.getElementById('commentText').value.trim();if(v){closeModal();showNotice('Demo comment: '+v)}}
function openProfile(){openModal('Your Profile','<p>PkShorts creator profile</p><p>Video uploads aur followers ko online save karne ke liye account system/backend chahiye.</p>')}
function uploadVideo(e){let f=e.target.files[0];if(!f)return;if(!f.type.startsWith('video/')){showNotice('Video file select karein');return}let url=URL.createObjectURL(f);let s=document.createElement('section');s.className='video-card';s.innerHTML='<video playsinline loop autoplay controls></video><div class="shade"></div><div class="info"><div class="user">@you</div><div class="desc">Aapki local video · #PkShorts</div></div>';s.querySelector('video').src=url;document.getElementById('feed').prepend(s);document.getElementById('feed').scrollTo({top:0,behavior:'smooth'});showNotice('Video is device par preview ho rahi hai; online upload abhi enabled nahi.');e.target.value=''}
document.querySelectorAll('video').forEach(v=>v.addEventListener('click',()=>{if(v.paused)v.play();else v.pause()}));
</script></body></html>
